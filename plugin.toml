schema_version = 3
name = "s3"
version = "0.3.0-rc.1"
description = "bounded read-only S3-compatible object, metadata, and single-page prefix reader for Sigil"
license = "MIT"

[component]
file = "plugin.wasm"
entrypoint = "sigil:s3/client@0.3.0"

[requires]
sigil = ">=0.33.1, <1.0.0"
host_api = "^1.2"

[capabilities]
network = true
sigv4 = true

[repository]
source = "github:sigil-plugins/s3"
