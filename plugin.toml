schema_version = 2
name = "s3"
version = "0.2.0"
description = "bounded anonymous, presigned, and host-signed S3-compatible object and metadata reader for Sigil"
license = "MIT"

[component]
file = "plugin.wasm"
entrypoint = "sigil:s3/client@0.2.0"

[requires]
sigil = ">=0.33.0, <1.0.0"
host_api = "^1.1"

[capabilities]
network = true
sigv4 = true

[repository]
source = "github:sigil-plugins/s3"
